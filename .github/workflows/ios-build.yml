name: iOS Build (simulator verification)

# Xcode only runs on macOS, so this uses GitHub's hosted macOS runners.
# This workflow builds for the iOS SIMULATOR, which needs no Apple Developer
# account or signing - it's a fast way to confirm the app compiles after
# every change.
#
# It does NOT produce an App Store .ipa. That step needs real code signing,
# which needs your own paid Apple Developer account. See mobile/README.md
# ("Building for iOS / App Store") for the exact steps once you have one -
# the easiest path is opening ios/App/App.xcworkspace in Xcode on a Mac.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-for-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator (no signing required)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
