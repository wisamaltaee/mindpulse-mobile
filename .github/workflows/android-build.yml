name: Android Build

# Builds the MindPulse Android app using GitHub's hosted runners, which come with
# the Android SDK + build tools preinstalled. This means you do NOT need Android
# Studio installed locally just to get an installable APK.
#
# - Every push/PR: builds an unsigned debug APK (installable on your own phone
#   for testing, not accepted by Play Store).
# - If you add the MINDPULSE_KEYSTORE_* secrets described in mobile/README.md,
#   it also builds a signed release AAB (the format Play Store requires for
#   publishing).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.MINDPULSE_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindpulse-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # --- Signed release build (only runs once you've added the secrets) ---
      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          MINDPULSE_KEYSTORE_BASE64: ${{ secrets.MINDPULSE_KEYSTORE_BASE64 }}
        run: echo "$MINDPULSE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          MINDPULSE_KEYSTORE_BASE64: ${{ secrets.MINDPULSE_KEYSTORE_BASE64 }}
          MINDPULSE_KEYSTORE_PATH: android/release.keystore
          MINDPULSE_KEYSTORE_PASSWORD: ${{ secrets.MINDPULSE_KEYSTORE_PASSWORD }}
          MINDPULSE_KEY_ALIAS: ${{ secrets.MINDPULSE_KEY_ALIAS }}
          MINDPULSE_KEY_PASSWORD: ${{ secrets.MINDPULSE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mindpulse-release-aab
          path: android/app/build/outputs/bundle/release/*.aab